<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is required for env(safe-area-inset-*) to report real
      values on notched iPhones. maximum-scale is left alone so pinch-zoom keeps
      working for accessibility; Safari's focus-zoom is prevented by using a
      16px input font instead.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111113" />
    <meta
      name="description"
      content="Chorus - private multi-model chat on Amazon Bedrock. Many models. One conversation."
    />
    <!-- Lets the site behave like a standalone app when added to an iOS home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chorus" />
    <!-- Inline SVG favicon: no extra request, and it scales cleanly. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23111113'/%3E%3Cg fill='none' stroke='%23fafafa' stroke-width='1.6'%3E%3Ccircle cx='9' cy='12' r='5.5' opacity='.45'/%3E%3Ccircle cx='12' cy='12' r='5.5' opacity='.7'/%3E%3Ccircle cx='15' cy='12' r='5.5'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Chorus - Multi-Model Chat</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
