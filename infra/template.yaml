AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Private AI chat application over Amazon Bedrock. Provisions a Cognito user pool
  (administrator-created users only), a DynamoDB table for conversation history,
  and an EC2 instance running the Node server behind Caddy for automatic TLS,
  published at a Route 53 subdomain.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: DNS
        Parameters:
          - HostedZoneId
          - DomainName
      - Label:
          default: Networking
        Parameters:
          - VpcId
          - SubnetId
      - Label:
          default: Compute
        Parameters:
          - InstanceType
          - ArtifactS3Uri
      - Label:
          default: Cost controls and alerting
        Parameters:
          - MonthlyBudgetUsd
          - BedrockCostExplorerServiceName
          - BudgetAlertEmail
          - AlertPhoneNumber
          - DailyTokenBudget

Parameters:
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID that owns the parent domain.
    AllowedPattern: '^Z[A-Z0-9]+$'

  DomainName:
    Type: String
    Description: >-
      Fully qualified name to publish, for example chat.example.com. The origin is
      published at origin.<this name>, so both must sit inside the hosted zone.
    AllowedPattern: '^[a-z0-9.-]+\.[a-z]{2,}$'

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >-
      Existing VPC for the instance. A dedicated VPC would be preferable but the
      default quota is 5 per Region; raise it via Service Quotas if you want one.
      Check that the chosen VPC is not associated with a private hosted zone that
      shadows an AWS service domain, since that can hijack Bedrock DNS.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      Public subnet in that VPC, with a route to an internet gateway. The subnet
      should auto-assign public IPs so user data can reach the internet before
      the Elastic IP is attached.

  MantleRegion:
    Type: String
    Default: us-east-2
    AllowedValues:
      - us-east-1
      - us-east-2
      - us-west-2
    Description: >-
      Region for the bedrock-mantle endpoint that serves Grok. Kept separate from
      the stack Region because Grok is in-region only, with no geo or global
      inference profile to route around a Region having problems. us-east-1 was
      observed timing out consistently while us-east-2 responded normally.

  OriginSecretVersionId:
    Type: String
    Default: ''
    Description: >-
      Optional Secrets Manager version ID for the origin secret. Leave blank to
      use AWSCURRENT. Because CloudFormation builds a changeset by diffing the
      template text, a dynamic reference is not re-resolved when only the secret
      value changed -- the distribution would keep serving the old header. Pass
      the new version ID after rotating so the change is visible to
      CloudFormation.

  CloudFrontPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: >-
      AWS-managed prefix list com.amazonaws.global.cloudfront.origin-facing for
      this Region. Find it with:
      aws ec2 describe-managed-prefix-lists --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing
    AllowedPattern: '^pl-[0-9a-f]+$'

  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues:
      - t4g.micro
      - t4g.small
      - t4g.medium
    Description: Graviton instance type. The template uses an arm64 AMI.

  ArtifactS3Uri:
    Type: String
    Description: >-
      S3 URI of the application bundle produced by infra/package.sh, for example
      s3://my-bucket/ai-chat/app.tar.gz
    AllowedPattern: '^s3://[a-z0-9.-]+/.+\.tar\.gz$'

  AccountMonthlyBudgetUsd:
    Type: Number
    Default: 3000
    MinValue: 1
    Description: >-
      Unfiltered monthly budget covering all AWS spend, not just Bedrock. The
      Bedrock-scoped budget below deliberately ignores EC2, CloudFront, DynamoDB
      and everything else, so without this nothing watches the account total.

  MonthlyBudgetUsd:
    Type: Number
    Default: 150
    MinValue: 1
    Description: >-
      Monthly Bedrock cost budget. Bedrock enforces no spend ceiling of its own,
      so this alarm is the backstop. Scoped to Bedrock only, so infrastructure
      costs such as EC2 and CloudFront are not counted or alerted here.

  BedrockCostExplorerServiceName:
    Type: String
    Default: Amazon Bedrock Service
    Description: >-
      Cost Explorer SERVICE dimension value used to scope the budget. Must match
      exactly; an incorrect value makes the budget track nothing rather than
      erroring. Verify with:
      aws ce get-dimension-values --dimension SERVICE --time-period Start=...,End=...

  BudgetAlertEmail:
    Type: String
    Description: Email address notified when the budget threshold is crossed.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  AlertPhoneNumber:
    Type: String
    Default: ''
    Description: >-
      Optional E.164 phone number for SMS alerts, for example +14155550123.
      Leave blank to skip SMS. While the account is in the SNS SMS sandbox the
      number must first be verified with sns create-sms-sandbox-phone-number.
      Note that Indian (+91) destinations additionally require TRAI DLT
      registration or messages are dropped silently.
    AllowedPattern: '^(\+[1-9]\d{7,14})?$'

  DailyTokenBudget:
    Type: Number
    Default: 200000
    MinValue: 1000
    Description: Per-user daily output-token cap enforced by the application.

Conditions:
  HasPhoneNumber: !Not [!Equals [!Ref AlertPhoneNumber, '']]

Resources:
  # ---------------------------------------------------------------------------
  # Origin shared secret
  #
  # The security group admits the AWS-managed CloudFront prefix list, but that
  # covers every CloudFront distribution including other customers'. The origin
  # additionally requires a header only this distribution sends, which is what
  # makes the restriction meaningful.
  # ---------------------------------------------------------------------------
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-origin-secret'
      Description: Shared secret proving a request arrived via our CloudFront distribution
      GenerateSecretString:
        PasswordLength: 64
        # Only characters that are safe in an HTTP header value.
        ExcludePunctuation: true
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Application
          Value: ai-chat

  # ---------------------------------------------------------------------------
  # Edge
  # ---------------------------------------------------------------------------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      # DNS validation renews automatically for as long as the record stays in
      # place, unlike email validation.
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Application
          Value: ai-chat

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} chat application'
        Aliases:
          - !Ref DomainName
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: instance
            # A dedicated hostname for the origin so the viewer-facing name can
            # point at CloudFront while Caddy still holds a real certificate for
            # the origin, keeping the hop encrypted end to end.
            DomainName: !Sub 'origin.${DomainName}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              # Raised from the 30s default because a reasoning model can be slow
              # to produce its first token. The server also heartbeats, which is
              # what actually keeps this from tripping.
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Secret
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginSecret}:SecretString:::${OriginSecretVersionId}}}'
        DefaultCacheBehavior:
          TargetOriginId: instance
          ViewerProtocolPolicy: redirect-to-https
          # index.html must never be served stale, or a deploy leaves clients on
          # an old bundle referencing assets that no longer exist.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: instance
            ViewerProtocolPolicy: https-only
            # CachingDisabled: responses are per-user and streamed.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader forwards the Authorization header, which
            # is required, while letting CloudFront set Host itself.
            #
            # Not AllViewer: that forwards the viewer's Host header, and
            # CloudFront derives origin SNI from Host. The origin would then be
            # asked for a certificate for the viewer domain, which it does not
            # hold, and every request would fail the TLS handshake and surface as
            # a 502.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # Compression must stay off here. CloudFront buffers when compressing
            # and that defeats text/event-stream, turning a streaming reply into
            # one delayed blob.
            Compress: false
          - PathPattern: /assets/*
            TargetOriginId: instance
            ViewerProtocolPolicy: redirect-to-https
            # CachingOptimized is safe because Vite fingerprints asset filenames.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            AllowedMethods: [GET, HEAD]
            Compress: true
      Tags:
        - Key: Application
          Value: ai-chat

  # ---------------------------------------------------------------------------
  # Alerting
  # ---------------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alerts'
      DisplayName: AIChat
      Tags:
        - Key: Application
          Value: ai-chat

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # AWS Budgets publishes from its own service principal, and without
          # this the budget silently fails to deliver to the topic.
          - Sid: AllowBudgetsToPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlertSmsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasPhoneNumber
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: sms
      Endpoint: !Ref AlertPhoneNumber

  # ---------------------------------------------------------------------------
  # Conversation storage
  # ---------------------------------------------------------------------------
  ChatTable:
    Type: AWS::DynamoDB::Table
    # Retained so tearing the stack down does not silently destroy chat history.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: ai-chat

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      # Self-service signup is disabled: only an administrator can create users,
      # which is what keeps this deployment closed to invited peers.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: false
          Mutable: true
      UserPoolTags:
        Application: ai-chat

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${AWS::StackName}-web'
      # A public browser client must not have a secret.
      GenerateSecret: false
      ExplicitAuthFlows:
        # SRP only: the password is never transmitted to Cognito in the clear.
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  # Separate client for the Obsidian plugin. SRP needs a browser-grade crypto
  # stack that an Obsidian plugin cannot reasonably carry, especially on mobile,
  # so this client permits USER_PASSWORD_AUTH instead. It is deliberately a second
  # client rather than an extra flow on the web one: the browser stays SRP-only,
  # and this client can be revoked or rotated on its own if a vault leaks.
  # The password still only ever travels to Cognito over TLS.
  PluginUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${AWS::StackName}-obsidian'
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  # ---------------------------------------------------------------------------
  # Instance identity and permissions
  # ---------------------------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager shell access, so the security group needs no SSH port.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      # Tagged explicitly: CloudFormation does not propagate stack-level tags to
      # IAM resources, so this role would otherwise be untracked.
      Tags:
        - Key: project
          Value: aichatbot
        - Key: auto-delete
          Value: 'no'
      Policies:
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Claude, through the bedrock-runtime Converse API. Both the
              # inference profile and every foundation model it can route to must
              # be allowed.
              - Sid: InvokeClaudeViaInferenceProfile
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-4-5-20250929-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-opus-4-5-20251101-v1:0'
                  # A global profile's model list includes a Region-less
                  # foundation-model ARN, because it can route anywhere. Without
                  # these two entries the call fails with AccessDenied.
                  - !Sub 'arn:${AWS::Partition}:bedrock:::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:::foundation-model/anthropic.claude-opus-4-5-20251101-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-opus-4-5-20251101-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-opus-4-5-20251101-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-opus-4-5-20251101-v1:0'

              # Grok, through the OpenAI-compatible bedrock-mantle endpoint.
              #
              # Mantle has its own IAM namespace and does not use
              # bedrock:InvokeModel at all. Inference is authorised as
              # bedrock-mantle:CreateInference against a *project* resource, not
              # against a foundation model.
              #
              # Consequence worth understanding: Mantle inference cannot be
              # scoped to a single model through IAM, so this grant permits any
              # model available on Mantle in this account, not just Grok. The
              # server-side model registry and the per-user token budget are what
              # actually constrain which models get called. Scoping the resource
              # to the default project is still tighter than the "*" that the AWS
              # documentation suggests.
              # The project resource is Region-scoped, so this must name the
              # Mantle Region rather than the stack Region.
              - Sid: InvokeGrokViaMantle
                Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - bedrock-mantle:GetProject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock-mantle:${MantleRegion}:${AWS::AccountId}:project/default'

              # Discovery calls the SDK makes that are not addressable per
              # project.
              - Sid: MantleDiscovery
                Effect: Allow
                Action:
                  # Note: the AWS documentation example spells this
                  # "ListTagsForResources", which is not a real action. IAM
                  # accepts unknown action names silently, so the plural form
                  # would be a dead grant.
                  - bedrock-mantle:ListProjects
                  - bedrock-mantle:ListTagsForResource
                Resource: '*'

              # Mantle authenticates with a short-lived bearer token derived from
              # these instance credentials rather than SigV4, which is gated by a
              # separate action in its own service namespace. Neither action
              # supports resource-level scoping, so the model restrictions above
              # are what actually limit which models can be called.
              - Sid: UseShortTermBearerToken
                Effect: Allow
                Action:
                  - bedrock-mantle:CallWithBearerToken
                  - bedrock:CallWithBearerToken
                Resource: '*'
                Condition:
                  StringEquals:
                    # Deliberately restricted to short-term tokens: long-term API
                    # keys are standing credentials and this app never needs one.
                    bedrock-mantle:bearerTokenType: SHORT_TERM

        - PolicyName: chat-storage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !GetAtt ChatTable.Arn

        - PolicyName: acme-dns-challenge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Caddy proves domain control by writing a TXT record, which is the
              # only challenge type that works when no inbound port is open.
              # Scoped to this hosted zone so the instance cannot edit other DNS.
              - Sid: WriteAcmeChallengeRecords
                Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:ListResourceRecordSets
                Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}'
              - Sid: PollChangeStatus
                Effect: Allow
                Action:
                  # These accept no resource qualifier.
                  - route53:GetChange
                  - route53:ListHostedZonesByName
                Resource: '*'

        - PolicyName: read-origin-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OriginSecret

        - PolicyName: read-application-bundle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - 'arn:${AWS::Partition}:s3:::${BundlePath}'
                  - BundlePath: !Select [1, !Split ['s3://', !Ref ArtifactS3Uri]]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # ---------------------------------------------------------------------------
  # Network exposure
  # ---------------------------------------------------------------------------
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from CloudFront only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # Only CloudFront can reach the origin. Referencing the AWS-managed
        # prefix list keeps this current as CloudFront's ranges change, with no
        # open CIDR anywhere.
        #
        # Port 80 is deliberately absent. Caddy validates certificates over
        # DNS-01 against Route 53, so no inbound ACME path is needed -- which is
        # also the only way renewal can keep working behind a closed origin.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: HTTPS from CloudFront edge locations
      # No SSH ingress: shell access is via Session Manager.
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound to Bedrock, DynamoDB, Cognito and package mirrors
      Tags:
        - Key: Application
          Value: ai-chat

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Application
          Value: ai-chat

  EipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  # Viewer-facing name points at CloudFront, not the instance.
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        # Fixed magic value identifying CloudFront as an alias target.
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # Origin name, resolvable so Caddy can hold a publicly trusted certificate for
  # it and CloudFront can reach it over HTTPS. Exposure is limited by the
  # security group and the shared secret, not by hiding this record.
  OriginDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'origin.${DomainName}'
      Type: A
      TTL: 300
      ResourceRecords:
        - !Ref ElasticIp

  # ---------------------------------------------------------------------------
  # Compute
  # ---------------------------------------------------------------------------
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      # Resolved at deploy time so the stack always launches a current AL2023
      # arm64 image rather than a hard-coded AMI that ages out.
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        # IMDSv2 only, to prevent SSRF in the app from reaching instance
        # credentials through the legacy metadata endpoint.
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      # Blocks TerminateInstances outright. Tags only deter tooling that chooses
      # to read them; this is an actual refusal from the EC2 API.
      #
      # Note: some managed accounts prevent this being set so their cleanup
      # tooling can still reclaim instances. ModifyInstanceAttribute returns
      # success and the attribute stays false. Verify rather than assume:
      #   aws ec2 describe-instance-attribute --instance-id <id> \
      #     --attribute disableApiTermination
      DisableApiTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-app'
        - Key: Application
          Value: ai-chat
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          NODE_VERSION=22.13.0
          APP_DIR=/opt/ai-chat

          dnf -y update
          dnf -y install tar gzip

          # Install Node from the official tarball so the runtime version is
          # pinned and does not depend on distro repo contents.
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-arm64.tar.xz" \
            -o /tmp/node.tar.xz
          mkdir -p /opt/node
          tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
          ln -sf /opt/node/bin/node /usr/local/bin/node
          ln -sf /opt/node/bin/npm /usr/local/bin/npm

          # Application bundle, built and uploaded by infra/package.sh.
          mkdir -p "$APP_DIR"
          aws s3 cp "${ArtifactS3Uri}" /tmp/app.tar.gz
          tar -xzf /tmp/app.tar.gz -C "$APP_DIR"

          cd "$APP_DIR/server"
          npm ci --omit=dev

          # Runtime configuration. These are identifiers, not secrets: AWS
          # credentials come from the instance role.
          # Fetched at boot rather than templated in, so the secret never appears
          # in the launch template or in CloudFormation's stored user data.
          #
          # Tracing is disabled around this block: with `set -x` still on, the
          # secret would be echoed into the cloud-init log and into the output of
          # any tool that re-runs this script.
          set +x
          ORIGIN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id '${OriginSecret}' --region ${AWS::Region} \
            --query SecretString --output text)

          cat > /etc/ai-chat.env <<EOF
          AWS_REGION=${AWS::Region}
          MANTLE_REGION=${MantleRegion}
          PORT=8080
          TABLE_NAME=${ChatTable}
          COGNITO_USER_POOL_ID=${UserPool}
          COGNITO_CLIENT_ID=${UserPoolClient}
          COGNITO_PLUGIN_CLIENT_ID=${PluginUserPoolClient}
          DAILY_TOKEN_BUDGET=${DailyTokenBudget}
          STATIC_DIR=../web/dist
          ORIGIN_SECRET=$ORIGIN_SECRET
          EOF
          chmod 640 /etc/ai-chat.env
          set -x

          id -u aichat >/dev/null 2>&1 || useradd --system --shell /sbin/nologin aichat
          chown -R aichat:aichat "$APP_DIR"
          chown root:aichat /etc/ai-chat.env

          cat > /etc/systemd/system/ai-chat.service <<'EOF'
          [Unit]
          Description=AI Chat application server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=aichat
          WorkingDirectory=/opt/ai-chat/server
          EnvironmentFile=/etc/ai-chat.env
          ExecStart=/usr/local/bin/node src/index.js
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true

          [Install]
          WantedBy=multi-user.target
          EOF

          # Caddy terminates TLS and obtains certificates automatically over
          # ACME. It is fetched as a static binary because AL2023 does not
          # package it.
          # Caddy is downloaded with the route53 DNS module already compiled in.
          # The stock binary cannot solve DNS-01, and `caddy add-package` would
          # need a second network round trip and a restart at boot.
          # Download to a temporary path first. Writing straight to the
          # destination fails with ETXTBSY if caddy is already running, which
          # makes re-running this script on an existing instance abort.
          #
          # The download service builds on demand with the requested plugin. It
          # serves the current release, so the binary is not version-pinned.
          curl -fsSL -o /tmp/caddy \
            "https://caddyserver.com/api/download?os=linux&arch=arm64&p=github.com%2Fcaddy-dns%2Froute53"
          chmod +x /tmp/caddy

          # Verify the plugin is really in the binary; a plain build would fail
          # later at certificate renewal rather than here.
          #
          # Written to a file instead of piped into grep on purpose: with
          # pipefail set, `grep -q` exits on first match and closes the pipe,
          # caddy takes SIGPIPE, and the pipeline reports failure even though the
          # module was found.
          HOME=/root /tmp/caddy list-modules > /tmp/caddy-modules.txt 2>/dev/null
          grep -q '^dns\.providers\.route53$' /tmp/caddy-modules.txt \
            || { echo 'route53 DNS module missing from Caddy build' >&2; exit 1; }

          systemctl stop caddy 2>/dev/null || true
          install -m 0755 /tmp/caddy /usr/local/bin/caddy
          id -u caddy >/dev/null 2>&1 || useradd --system --home /var/lib/caddy --create-home --shell /sbin/nologin caddy

          mkdir -p /etc/caddy
          cat > /etc/caddy/Caddyfile <<EOF
          origin.${DomainName} {
            # DNS-01 rather than HTTP-01: no inbound port is open to the ACME
            # servers, since the security group admits CloudFront only. This is
            # also what allows renewal to keep working.
            tls {
              dns route53 {
                max_retries 10
              }
            }

            encode zstd gzip

            # Server-sent events must not be buffered, or the client receives the
            # whole reply at once instead of streaming.
            reverse_proxy localhost:8080 {
              flush_interval -1
            }
          }
          EOF

          cat > /etc/systemd/system/caddy.service <<'EOF'
          [Unit]
          Description=Caddy web server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=notify
          User=caddy
          Group=caddy
          # systemd does not set HOME for a system user, and Caddy stores issued
          # certificates under the data directory it derives from it.
          Environment=HOME=/var/lib/caddy
          Environment=XDG_DATA_HOME=/var/lib/caddy
          # The route53 module signs with the instance role and the Go SDK wants a
          # region even though Route 53 is global.
          Environment=AWS_REGION=${AWS::Region}
          ExecStart=/usr/local/bin/caddy run --environ --config /etc/caddy/Caddyfile
          ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --force
          Restart=on-abnormal
          # Required to bind 80 and 443 as a non-root user.
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable ai-chat.service caddy.service
          # restart rather than `enable --now`: on an already-running instance the
          # latter is a no-op, so a re-run would leave the old code and the old
          # environment file in the running process.
          systemctl restart ai-chat.service
          systemctl restart caddy.service

  # ---------------------------------------------------------------------------
  # Cost guardrails
  #
  # Two budgets on purpose. The Bedrock-scoped one below is narrow enough to be
  # meaningful for this application, but that narrowness means it cannot see
  # infrastructure spend. An account-wide budget covers the rest.
  # ---------------------------------------------------------------------------
  AccountTotalBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-account-total-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref AccountMonthlyBudgetUsd
          Unit: USD
        # No CostFilters: this is deliberately every service in the account.
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
            - SubscriptionType: SNS
              Address: !Ref AlertTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
            - SubscriptionType: SNS
              Address: !Ref AlertTopic

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-bedrock-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        # Scoped to Bedrock so this budget tracks model spend only, and does not
        # fire because of unrelated services in the same account.
        #
        # The value must be the Cost Explorer service name exactly. It is
        # "Amazon Bedrock Service", not "Amazon Bedrock" -- a filter on the
        # shorter name matches nothing and the budget silently tracks $0 forever.
        # Confirm for your account with:
        #   aws ce get-dimension-values --dimension SERVICE \
        #     --time-period Start=<date>,End=<date>
        CostFilters:
          Service:
            - !Ref BedrockCostExplorerServiceName
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
            # The SNS topic is what fans out to SMS, and later to Slack if a
            # webhook subscriber is added.
            - SubscriptionType: SNS
              Address: !Ref AlertTopic
        - Notification:
            # Forecast alerts fire before the money is spent, which is the one
            # that actually gives you time to react.
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
            - SubscriptionType: SNS
              Address: !Ref AlertTopic

Outputs:
  ApplicationUrl:
    Description: Public URL of the chat application.
    Value: !Sub 'https://${DomainName}'

  PublicIp:
    Description: Elastic IP assigned to the instance.
    Value: !Ref ElasticIp

  UserPoolId:
    Description: Cognito user pool ID, needed to create users.
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito app client ID used by the browser.
    Value: !Ref UserPoolClient

  PluginUserPoolClientId:
    Description: Cognito app client ID used by the Obsidian plugin.
    Value: !Ref PluginUserPoolClient

  TableName:
    Description: DynamoDB table holding conversations and messages.
    Value: !Ref ChatTable

  DistributionDomainName:
    Description: CloudFront domain name backing the public URL.
    Value: !GetAtt Distribution.DomainName

  OriginDomainName:
    Description: >-
      Origin hostname. Reachable only from CloudFront, and only with the shared
      secret header, so a direct request should return 403.
    Value: !Sub 'origin.${DomainName}'

  AlertTopicArn:
    Description: >-
      SNS topic carrying budget alerts. Subscribe additional endpoints here, for
      example a Lambda that forwards to a Slack incoming webhook.
    Value: !Ref AlertTopic

  CreateUserCommand:
    Description: Command to invite a peer. They set a permanent password on first sign-in.
    Value: !Sub >-
      aws cognito-idp admin-create-user --user-pool-id ${UserPool}
      --username USERNAME --temporary-password 'ChangeMe-12345'
      --message-action SUPPRESS --region ${AWS::Region}
